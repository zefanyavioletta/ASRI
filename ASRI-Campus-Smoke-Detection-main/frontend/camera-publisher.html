<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASRI Camera Publisher</title><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#f3f6f4;color:#173b2c;font-family:Arial,sans-serif}.wrap{max-width:620px;margin:auto;background:white;border-radius:18px;padding:22px;box-shadow:0 8px 28px #183d2b14}h1{margin:0 0 8px}p{color:#5e7167;line-height:1.5}video{width:100%;background:#15251c;border-radius:12px;max-height:58vh;object-fit:cover}button,select{padding:13px 16px;border:0;border-radius:9px;font-weight:700;font-size:15px;margin:8px 6px 0 0}button{background:#1d704b;color:white}button.stop{background:#a83232}button:disabled{opacity:.5}#status{padding:12px;background:#eef5ef;border-radius:9px;margin-top:14px;font-size:14px}
</style></head><body><main class="wrap"><h1>ASRI – Kamera HP</h1><p>Biarkan halaman ini terbuka selama HP digunakan untuk pemantauan. Izinkan akses kamera saat diminta.</p><video id="preview" autoplay muted playsinline></video><div><select id="facing"><option value="environment">Kamera belakang</option><option value="user">Kamera depan</option></select><button id="start">Mulai Kirim Kamera</button><button id="stop" class="stop" disabled>Hentikan</button></div><div id="status">Memeriksa konfigurasi kamera...</div><canvas id="frame" hidden></canvas></main><script>
const params=new URLSearchParams(location.search),id=params.get('id'),token=params.get('token');const $=s=>document.querySelector(s);let stream=null,timer=null,busy=false;
if(!id||!token)$('#status').textContent='Link kamera tidak lengkap. Buat link baru dari dashboard ASRI.';else $('#status').textContent='Siap. Tekan Mulai Kirim Kamera.';
$('#start').onclick=async()=>{if(!id||!token)return;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:$('#facing').value,width:{ideal:960},height:{ideal:540}},audio:false});$('#preview').srcObject=stream;$('#start').disabled=true;$('#stop').disabled=false;$('#facing').disabled=true;$('#status').textContent='Kamera aktif. Mengirim frame ke ASRI setiap 1,5 detik.';timer=setInterval(sendFrame,1500);sendFrame();}catch(e){$('#status').textContent='Tidak dapat membuka kamera: '+e.message+' Pastikan link dibuka melalui HTTPS dan izin kamera diberikan.';}};
async function sendFrame(){if(busy||!stream)return;const v=$('#preview');if(!v.videoWidth)return;busy=true;const c=$('#frame');c.width=Math.min(v.videoWidth,960);c.height=Math.round(c.width*v.videoHeight/v.videoWidth);c.getContext('2d').drawImage(v,0,0,c.width,c.height);const blob=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.72));const fd=new FormData();fd.append('file',blob,'phone-frame.jpg');fd.append('token',token);fd.append('confidence',.42);try{const r=await fetch(`/api/cameras/${id}/frame`,{method:'POST',body:fd});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||'Server menolak frame.');}$('#status').textContent='Terhubung ke ASRI · frame terakhir berhasil dikirim '+new Date().toLocaleTimeString('id-ID');}catch(e){$('#status').textContent='Koneksi bermasalah: '+e.message;}finally{busy=false;}}
function stop(){if(timer)clearInterval(timer);timer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('#preview').srcObject=null;$('#start').disabled=false;$('#stop').disabled=true;$('#facing').disabled=false;$('#status').textContent='Pengiriman kamera dihentikan.';}$('#stop').onclick=stop;window.addEventListener('pagehide',stop);
</script></body></html>
